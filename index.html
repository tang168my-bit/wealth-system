<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>財富管理系統</title>
<meta name="theme-color" content="#1d6b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財富系統">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: one column ledger. Sticky scrollable section bar on top; each section = inputs, then results, then formula cards. Fixed light theme. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --ink:#15262d; --muted:#5d6e75; --line:#d8e2e0;
  --accent:#1d6b66; --accent-soft:#e2efed; --gold:#9a6f18; --gold-soft:#f6eedb;
  --ok:#2c8650; --ok-soft:#e1f1e6; --warn:#a97a0c; --warn-soft:#f7eed3; --bad:#bb4136; --bad-soft:#f8e2df;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.local{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--bad-soft);color:var(--bad)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.nav button{flex:0 0 auto;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.nav button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.nav .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
main{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lead{display:flex;flex-direction:column;gap:4px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:40px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{font:inherit;font-size:.85rem;width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);background:var(--surface)}
.btn{font:inherit;font-weight:500;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;min-height:44px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:38px;padding:5px 12px;font-size:.88rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);min-width:0}
.assume{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.74rem;letter-spacing:.08em;color:var(--gold);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.kv{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:4px solid transparent}
.kv span{font-size:.8rem;color:var(--muted)}
.kv b{font-size:1.12rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv small{font-size:.75rem;color:var(--muted)}
.kv.ok{border-left-color:var(--ok)} .kv.warn{border-left-color:var(--warn)} .kv.bad{border-left-color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th{background:var(--bg);text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;white-space:nowrap;font-size:.8rem}
.tbl td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td input,.tbl td select{min-height:36px;padding:5px 7px;min-width:96px}
.tbl td.cv{white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);font-size:.85rem}
.tbl th.cvh{background:var(--accent-soft);color:var(--accent)}
.tbl .del{font:inherit;border:0;background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer;min-width:36px;min-height:36px;border-radius:8px}
.tbl .del:hover{background:var(--bad-soft);color:var(--bad)}
.tbl.read td{padding:7px 10px;font-variant-numeric:tabular-nums}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:.9rem}
.tag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.hint{font-size:.86rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.fxs{display:flex;flex-direction:column;gap:6px}
details.fx{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.fx summary{cursor:pointer;padding:8px 12px;font-size:.88rem;color:var(--accent);font-weight:500}
details.fx[open] summary{border-bottom:1px solid var(--line)}
.fcard{padding:12px;display:flex;flex-direction:column;gap:6px}
.fname{font-weight:700}
.fexpr{font-family:var(--mono);font-size:.86rem;background:var(--gold-soft);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap}
.fexcel{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.85rem}
.fexcel span{font-size:.72rem;font-weight:700;color:var(--ok);letter-spacing:.06em}
.fexcel code{font-family:var(--mono);overflow-wrap:anywhere}
.fsrc{font-size:.76rem;color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.lib .fcard{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.howto{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:.86rem}
.howto b{color:var(--accent);margin-right:6px}
.fbar{background:#fbe7d4;color:#8a4a12;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:.9rem}
.btn.warm{background:#c0661c;border-color:#c0661c}
.btn.warm.ghost{background:transparent;color:#c0661c}
.repsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px}
.repsel label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.9rem;cursor:pointer}
.repsel input{width:auto;min-height:0}
.repwrap{overflow-x:auto}
#rep-card{width:720px;max-width:none;background:#fff;color:#15262d;border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:16px}
#rep-card .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--accent);padding-bottom:10px}
#rep-card h3{font-size:1.05rem;color:var(--accent)}
#rep-card .rfoot{font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
#rep-img img{width:100%;max-width:720px;border:1px solid var(--line);border-radius:10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;min-height:40px;cursor:pointer;color:var(--ink)}
.sub button[aria-current=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
/* client check */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ctag{font-size:.74rem;letter-spacing:.06em;color:var(--accent);font-weight:700}
.ctag.wall{color:var(--gold)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choices button,.yn button,.seg button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;min-height:44px;cursor:pointer;padding:4px}
.choices button[data-v=ok][aria-pressed=true],.yn button[data-v=y][aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button[data-v=unsure][aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}
.choices button[data-v=no][aria-pressed=true],.yn button[data-v=n][aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:flex;gap:6px}.seg button{min-width:64px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.grid6{grid-template-columns:repeat(2,1fr)}}
.tile{font:inherit;border:2px solid transparent;border-radius:12px;padding:10px 6px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:var(--bg);color:var(--ink)}
.tile b{font-family:var(--display);font-size:1.08rem}
.tile span{font-size:.8rem}
.tile.ok{background:var(--ok-soft)} .tile.ok span{color:var(--ok)}
.tile.unsure{background:var(--warn-soft)} .tile.unsure span{color:var(--warn)}
.tile.no{background:var(--bad-soft)} .tile.no span{color:var(--bad)}
.tile[aria-pressed=true]{border-color:var(--ink)}
.tile .pick{font-size:.72rem;color:var(--ink);font-weight:700}
.light{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.light.ok{background:var(--ok-soft);color:var(--ok)} .light.unsure{background:var(--warn-soft);color:var(--warn)} .light.no{background:var(--bad-soft);color:var(--bad)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.checkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.checkrow:last-child{border-bottom:0}
.yn{display:flex;gap:6px;flex-shrink:0}.yn button{min-width:52px;min-height:40px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.svgbox svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.nav button,.tile,.choices button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>財富管理系統</h1>
      <p class="muted">記錄真實數字，在用的過程中學會每一條公式</p>
    </div>
    <div class="top-r">
      <button type="button" class="btn small warm ghost" id="friend-btn">幫朋友算</button>
      <span class="pill local" id="sync" aria-live="polite">離線版：資料存在這部設備，記得定期複製備份</span>
      <label class="muted" for="cur" style="display:flex;gap:6px;align-items:center">幣種
        <select id="cur" style="width:auto;min-height:36px">
          <option value="HK$">港幣 HK$</option><option value="¥">人民幣 ¥</option><option value="US$">美元 US$</option>
        </select>
      </label>
    </div>
  </header>
  <div class="fbar" id="friend-bar" hidden><span><b>朋友模式</b>：這裡填的數字不會存進你的記錄。算完在頁面最下面按「下載這一頁的報告」，結束後朋友的數字會清空。</span><button type="button" class="btn small warm" id="friend-exit">結束朋友模式</button></div>
  <nav class="nav" id="nav" aria-label="系統分區"></nav>
  <main id="main"></main>
</div>
<div style="position:absolute;left:-10000px;top:0" aria-hidden="true"><div id="rep-card"></div></div>

<script src="html2canvas.min.js"></script>
<script>
(function(){
"use strict";
/* ================= 基本工具 ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const N=v=>{const x=parseFloat(v);return isFinite(x)?x:NaN};
const ok=x=>typeof x==='number'&&isFinite(x);
const thisMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const today=()=>{const d=new Date();return thisMonth()+'-'+String(d.getDate()).padStart(2,'0')};
function cur(){return (S.settings&&S.settings.cur)||'HK$'}
function money(n){if(!ok(n))return '–';const s=(Math.round(n)+0).toLocaleString('zh-Hant');return cur()+' '+s}
function pct(n,d){if(!ok(n))return '–';return (n*100).toFixed(d==null?1:d)+'%'}
function num(n,d){if(!ok(n))return '–';return n.toFixed(d==null?1:d)}
function months(m){if(m==null)return '–';if(m===Infinity)return '永遠到不了';if(!ok(m))return '–';if(m<=0)return '已達到';const y=Math.floor(m/12),r=Math.round(m%12);return (y?y+' 年 ':'')+(r?r+' 個月':(y?'':'0 個月'))}
function cls(x,good,mid){if(!ok(x))return '';return x>=good?'ok':(x>=mid?'warn':'bad')}
function kv(label,val,c,note){return `<div class="kv ${c||''}"><span>${label}</span><b>${val}</b>${note?`<small>${note}</small>`:''}</div>`}

/* ================= 資料與儲存 ================= */
const DEF={
  settings:{cur:'HK$',sign:'mani'},
  income:[],expense:[],assets:[],debts:[],invest:[],trades:[],biz:[],compare:[],ins:[],
  budget:{},goal:{type:'asset',rates:'2,4,6,8,10'},levsim:{},cmpYears:'',firms:[],disc:{},quick:{},report:{name:'',sel:['home']},
  check:{answers:{},selected:[],vals:{},medHas:'',leg:[null,null,null,null,null,null]},
  checkRecords:[]
};
const KEYS=Object.keys(DEF);
const S={};
const LS='wealthsys_v1';
function get(k){if(S[k]===undefined)S[k]=clone(DEF[k]);return S[k]}
try{const o=JSON.parse(localStorage.getItem(LS)||'{}');Object.keys(o).forEach(k=>{if(KEYS.includes(k))S[k]=o[k]})}catch(e){}
KEYS.forEach(get);
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let cloud=null;const timers={},dirty={},writing={};
function setSync(m){const el=$('sync');if(m==='cloud'){el.className='pill';el.textContent='已存到你的帳戶，換設備也看得到'}else if(m==='err'){el.className='pill err';el.textContent='雲端暫時存不到，資料先留在這台設備'}else{el.className='pill local';el.textContent='離線版：資料存在這部設備，記得定期複製備份'}}
let FRIEND=false,SAVED=null;
function persist(k){if(FRIEND)return;saveLocal();if(!cloud)return;dirty[k]=(dirty[k]||0)+1;clearTimeout(timers[k]);timers[k]=setTimeout(()=>writeCloud(k),700)}
async function writeCloud(k){
  if(writing[k]){timers[k]=setTimeout(()=>writeCloud(k),400);return}
  writing[k]=true;const v=dirty[k];
  try{await cloud.doc(k).set({v:S[k]});setSync('cloud')}catch(e){setSync('err')}
  writing[k]=false;if(dirty[k]===v)dirty[k]=0;
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const user=await window.claude.use('user');const db=await window.claude.use('db');
    if(!user||!db)return;const id=await user.id();if(!id)return;
    cloud=db.collection('data/users/'+id);
    const snap=await cloud.get();
    if(snap.empty){for(const k of KEYS){if(JSON.stringify(S[k])!==JSON.stringify(DEF[k])){dirty[k]=1;await writeCloud(k)}}}
    else{const tgt=FRIEND?SAVED:S;snap.docs.forEach(d=>{const b=d.data();if(b&&'v' in b&&KEYS.includes(d.id))tgt[d.id]=b.v});if(!FRIEND){saveLocal();render()}}
    setSync('cloud');
    cloud.onSnapshot(qs=>{
      let changed=false;
      qs.docChanges().forEach(ch=>{
        if(ch.type==='removed')return;const k=ch.doc.id;if(!KEYS.includes(k)||dirty[k])return;
        if(ch.doc.metadata.hasPendingWrites)return;const b=ch.doc.data();if(!b||!('v' in b))return;
        if(FRIEND){SAVED[k]=b.v;return}if(JSON.stringify(S[k])!==JSON.stringify(b.v)){S[k]=b.v;changed=true}
      });
      if(changed&&!FRIEND){saveLocal();const a=document.activeElement;if(!a||!$('main').contains(a)||a.tagName==='BUTTON')render()}
    },()=>setSync('err'));
  }catch(e){}
}

/* ================= 公式庫 ================= */
const SRC={A:'Notion〈理財需要懂公式〉',B:'Notion〈需求缺口公式總表〉',C:'Notion〈8 大知識模組〉',D:'Notion〈40 歲前投資 100 萬〉',E:'Notion〈絕對投資思維〉',F:'3 月對話〈Building financial models〉',G:'7 月對話〈財務規劃師必學 Excel 公式〉',H:'本次討論新增'};
const F={
 networth:{c:'財務地基',n:'淨資產',f:'淨資產 = 總資產 − 總負債',p:'你真正擁有多少。資產包括現金、投資現值和其他資產。',x:'=SUM(資產)-SUM(負債)',s:'C'},
 surplus:{c:'財務地基',n:'每月結餘',f:'每月結餘 = 月收入 − 月支出',p:'每個月真正能留下來、拿去累積財富的錢。',x:'=收入-支出',s:'C H'},
 saverate:{c:'財務地基',n:'儲蓄率',f:'儲蓄率 = 每月結餘 ÷ 月收入',p:'賺回來的錢有幾成留得住。這個比例決定財富增長的速度。',x:'=結餘/收入',s:'H'},
 emergency:{c:'財務地基',n:'應急金月數',f:'應急金月數 = 現金類資產 ÷ 平均月支出',p:'突然沒有收入時，現金能撐幾個月。你定的目標是 12 個月。',x:'=現金/AVERAGE(月支出)',s:'H'},
 weight:{c:'財務地基',n:'資產權重與集中度',f:'權重 = 某類資產 ÷ 總資產',p:'看錢是否太集中在同一類資產，集中度越高，單一風險越大。',x:'=B2/SUM($B$2:$B$20)',s:'C'},
 liquidity:{c:'財務地基',n:'快速可用比例',f:'快速可用比例 = (隨時可用 + 30 天內可變現) ÷ 總資產',p:'資產看起來多，不代表急用時拿得出來。',x:'=SUMIF(變現速度,"A",金額)+SUMIF(變現速度,"B",金額)',s:'C'},

/* ================= 衍生數字 ================= */
function monthAgg(){
  const m={};
  get('income').forEach(r=>{if(!r.m)return;const o=m[r.m]||(m[r.m]={inc:0,pas:0,exp:0});const a=N(r.amt)||0;o.inc+=a;if(r.type==='被動')o.pas+=a});
  get('expense').forEach(r=>{if(!r.m)return;const o=m[r.m]||(m[r.m]={inc:0,pas:0,exp:0});o.exp+=N(r.amt)||0});
  return m;
}
function recent(){
  const m=monthAgg();const ks=Object.keys(m).sort().slice(-6);
  if(!ks.length)return {n:0};
  const s=ks.reduce((a,k)=>{a.inc+=m[k].inc;a.pas+=m[k].pas;a.exp+=m[k].exp;return a},{inc:0,pas:0,exp:0});
  const last=ks[ks.length-1];
  return {n:ks.length,inc:s.inc/ks.length,pas:s.pas/ks.length,exp:s.exp/ks.length,last,lm:m[last]};
}
function investSummary(){
  const by={};
  get('invest').forEach(r=>{if(!r.name)return;(by[r.name]=by[r.name]||[]).push(r)});
  const out=[];const all=[];
  Object.keys(by).forEach(name=>{
    const rows=by[name].filter(r=>r.d&&ok(N(r.amt))).sort((a,b)=>a.d<b.d?-1:1);
    let inv=0,out2=0;const fl=[];const vals=[];
    rows.forEach(r=>{const a=N(r.amt);const d=new Date(r.d);
      if(r.kind==='投入'){inv+=a;fl.push({d,a:-a})}
      else if(r.kind==='取回'){out2+=a;fl.push({d,a})}
      else if(r.kind==='現值'){vals.push({d,a})}});
    const lastV=vals.length?vals[vals.length-1]:null;
    const flx=fl.slice();if(lastV)flx.push({d:lastV.d,a:lastV.a});
    let peak=-Infinity,mdd=0;vals.forEach(v=>{if(v.a>peak)peak=v.a;if(peak>0)mdd=Math.min(mdd,v.a/peak-1)});
    const value=lastV?lastV.a:NaN;
    out.push({name,inv,out:out2,value,pnl:(ok(value)?value:0)+out2-inv,irr:xirr(flx),mdd:vals.length>1?mdd:NaN});
    fl.forEach(x=>all.push(x));if(lastV)all.push({d:lastV.d,a:lastV.a});
  });
  const total=out.reduce((s,o)=>s+(ok(o.value)?o.value:0),0);
  return {list:out,total,irr:xirr(all)};
}
function debtSummary(){
  let bal=0,pay=0;get('debts').forEach(r=>{bal+=N(r.bal)||0;pay+=N(r.pay)||0});return {bal,pay};
}
function assetSummary(){
  let cash=0,other=0;get('assets').forEach(r=>{const a=N(r.amt)||0;if(r.cat==='現金')cash+=a;else other+=a});return {cash,other};
}
function xirr(fl){
  fl=fl.filter(x=>ok(x.a)&&x.d instanceof Date&&!isNaN(x.d)).sort((a,b)=>a.d-b.d);
  if(fl.length<2||!fl.some(x=>x.a>0)||!fl.some(x=>x.a<0))return NaN;
  const d0=fl[0].d;const f=r=>fl.reduce((s,x)=>s+x.a/Math.pow(1+r,(x.d-d0)/31557600000),0);
  let lo=-0.9999,hi=10,flo=f(lo),fhi=f(hi);if(!ok(flo)||!ok(fhi)||flo*fhi>0)return NaN;
  for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=f(m);if(Math.abs(fm)<1e-8)return m;if(flo*fm<0)hi=m;else{lo=m;flo=fm}}
  return (lo+hi)/2;
}
function payoff(B,rate,P){
  if(!(B>0)||!(P>0))return null;const i=(rate||0)/1200;if(P<=B*i)return {never:true};
  let b=B,m=0,int=0;while(b>0.005&&m<1200){const it=b*i;int+=it;b=b+it-P;m++}return {m,int};
}
function fvCalc(rm,n,pmt,pv){const g=Math.pow(1+rm,n);return pv*g+(rm?pmt*(g-1)/rm:pmt*n)}
function nperCalc(rm,pmt,pv,fv){
  if(pv>=fv)return 0;
  if(!rm)return pmt>0?(fv-pv)/pmt:Infinity;
  const a=fv*rm+pmt,b=pv*rm+pmt;if(b<=0||a/b<=0)return Infinity;
  const n=Math.log(a/b)/Math.log(1+rm);return n>0?n:Infinity;
}
function pmtCalc(rm,n,pv,fv){if(!(n>0))return NaN;const g=Math.pow(1+rm,n);return rm?(fv-pv*g)*rm/(g-1):(fv-pv)/n}
function rateCalc(n,pmt,pv,fv){
  if(!(n>0))return NaN;const f=r=>fvCalc(r/12,n,pmt,pv)-fv;let lo=-0.99,hi=2;
  if(f(lo)>0)return lo;if(f(hi)<0)return NaN;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m}return (lo+hi)/2;
}

function rat(a,b,d){const v=N(a)/N(b);return ok(v)&&N(b)!==0?pct(v,d):'–'}
function bizNet(r){const g=N(r.gm)/100,s=N(r.sales),f=N(r.fixed);return ok(g)&&ok(s)&&ok(f)?s*g-f:NaN}
function cmpYears(){return N(S.cmpYears)}
function cmpFV(r){const a=N(r.amt),x=N(r.ret)/100,y=cmpYears();return ok(a)&&ok(x)&&ok(y)?a*Math.pow(1+x,y):NaN}
function cmpBest(){const v=get('compare').map(cmpFV).filter(ok);return v.length?Math.max(...v):NaN}

function table(key){
  const sc=SCHEMA[key],rows=get(key),comp=sc.comp||[];
  const head=sc.cols.map(c=>`<th>${c.l}</th>`).join('')+comp.map(c=>`<th class="cvh">${c.l}</th>`).join('')+'<th></th>';
  const body=rows.length?rows.map((r,i)=>`<tr>${sc.cols.map(c=>`<td>${cell(key,i,c,r[c.k])}</td>`).join('')}${comp.map((c,ci)=>`<td class="cv" data-ck="${key}" data-i="${i}" data-ci="${ci}">${c.fn(r)}</td>`).join('')}<td><button type="button" class="del" data-del="${key}" data-i="${i}" aria-label="刪除這一筆">×</button></td></tr>`).join('')
    :`<tr><td colspan="${sc.cols.length+comp.length+1}" class="empty">還沒有記錄。按下面的「新增一筆」開始。</td></tr>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><button type="button" class="btn small ghost" data-add="${key}">＋ 新增一筆</button>`;
}
function cell(key,i,c,v){
  const a=`data-t="${key}" data-i="${i}" data-k="${c.k}" id="${key}-${i}-${c.k}" aria-label="${c.l}"`;
  if(c.t==='sel')return `<select ${a}>${c.o.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`;
  const type=c.t==='num'?'number':c.t==='month'?'month':c.t==='date'?'date':'text';
  return `<input type="${type}" ${a} value="${esc(v)}"${c.t==='num'?' inputmode="decimal" step="any"':''}${c.dl?` list="${c.dl}"`:''}>`;
}
function recalcCells(){
  document.querySelectorAll('td.cv').forEach(td=>{const sc=SCHEMA[td.dataset.ck];const r=get(td.dataset.ck)[+td.dataset.i];if(sc&&r)td.innerHTML=sc.comp[+td.dataset.ci].fn(r)});
}
function form(obj,fields){
  const o=get(obj);
  return `<div class="fields">${fields.map(f=>{
    const id=`${obj}-${f.k}`;
    if(f.t==='sel')return `<label class="f" for="${id}">${f.l}<select id="${id}" data-o="${obj}" data-k="${f.k}">${f.o.map(x=>`<option value="${x[0]}"${o[f.k]===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></label>`;
    return `<label class="f" for="${id}">${f.l}<input type="${f.t||'number'}" id="${id}" data-o="${obj}" data-k="${f.k}" value="${esc(o[f.k]==null?'':o[f.k])}"${(f.t||'number')==='number'?' inputmode="decimal" step="any"':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}></label>`;
  }).join('')}</div>`;
}

const HOW={"生成報告":["幫朋友算完之後，或者想把自己的結果整理成一張圖的時候。","填報告對象的名稱或代號，勾選要放進報告的分區，再按「生成報告圖片」。","先看下面的預覽，確認內容沒問題，再按「分享或儲存圖片」，選微信或 WhatsApp 傳送。"],"財富總覽": ["每月記錄完收支之後打開，一眼看整體狀況。", "這一頁大部分自動計算。只需要在下面「其他資產」填現金、房產等投資以外的資產，現金類記得選「現金」。", "左邊色條：綠色達標、黃色接近、紅色要注意。應急金目標是 12 個月；兩個覆蓋率到 100%，代表被動收入已經夠生活或夠還債。"], "收入記錄：你的賺錢能力": ["每月一次，月底或者收到佣金之後。", "每個來源一行。佣金、薪金選「主動」；租金、股息、利息選「被動」。同一個月可以有很多行。", "下面按月統計。最值得留意的是「被動佔比」有沒有慢慢上升，上升代表你離財務自由越來越近。"], "支出記錄": ["每月一次。", "按類別填當月總數，不用逐筆記。可以參考信用卡月結單和銀行流水。", "「儲蓄率」是收入留得住的比例；「支出分佈」看錢主要花在哪裡，先檢討最大的一兩項。"], "借貸記錄": ["新借一筆錢的時候，或者每年檢查一次。", "每筆債一行：剩餘欠款、年利率、每月還款。「每月多還」只是試算，填了不代表真的要多還。", "「還清需要」和「剩餘總利息」是這筆債的真實代價。出現紅色「月供不夠付利息」，代表永遠還不完，要立即處理。"], "投資記錄": ["每次買入、賣出或者收到分派時記一筆；另外每月或每季記一次「現值」。", "同一個投資用同一個名稱。「投入」是放進去的錢；「取回」是拿回來的錢，包括股息；「現值」是當天這筆投資值多少。", "XIRR 是真實年化回報，已經考慮每筆錢進出的時間，比只看賺了多少準確。最大回撤是曾經從最高點跌了多少，代表你承受過的最壞情況。"], "倉位紀律": ["準備把一筆錢放進某個投資之前。", "假設跌幅填你想測試的最壞情況。凱利那幾格填你對這類投資的估計：勝率、平均每次贏多少、平均每次輸多少。「只用凱利的幾成」建議填 50 或更少。", "「回本要漲」提醒你大虧之後有多難回來。凱利比例是上限參考，不是目標。最大一筆投資超過你自己定的上限，會亮紅色。"], "看懂一家公司": ["研究一家想投資的公司的時候。", "從公司年報抄數字，每年一行，同一家公司最好填 3 至 5 年。「你估算的價值」是你認為整家公司值多少，不確定可以留空。", "毛利率看定價能力；ROE 看本錢的賺錢能力；現金轉換率低於 1，代表利潤多於真正收到的現金，要小心。下面的趨勢表看這些數字是否多年穩定。"], "槓桿交易記錄": ["每做一筆期權、融資或期貨交易，平倉後記錄。", "「自己投入」是你付出的保證金或權利金；「實際控制金額」是合約代表的總價值；盈虧在平倉後填。", "「每筆期望值」是負數，代表長期做下去會虧錢。紅色標籤是虧損可以超過本金的交易，要特別小心。"], "創業項目記錄": ["有新的生意構思，或者每季檢討進行中的項目。", "一個項目一行。構思中的填預計數字，進行中的填實際數字，毛利率填百分比。項目結束後把狀態改成成功或失敗。", "「保本營業額」是每月最少要做到的生意額；「週轉金可撐」看能撐多久；「時薪」跟你的工作收入比較，看值不值得投入時間。"], "機會橫向比較": ["手上有一筆錢，在幾個選擇之間猶豫的時候。", "先填比較年數。每個選擇一行，回報和最大可能跌幅按產品資料或你的判斷填。安全性 1 最低、5 最高；鎖定年數填錢要多久才能取出，隨時可取填 0。", "「機會成本」是選了這個等於放棄了多少。不要只看期末值，同時看安全性、流動性和回報風險比。"], "生活與養老預算": ["每年檢討一次退休計劃。", "年齡和壽命按自己的情況填；每月支出和可投資資產留空，會自動用你的記錄；三個假設由你決定。", "「財務自由數字」是投資資產要達到多少才能不靠工作生活；「完成度」看自己走了多遠；「折回今天要準備」是換算成今天的錢。"], "教育金": ["孩子出生後就可以開始算，每年檢討一次。", "費用填今年的學費加生活費，按目標國家或地區查；學費上漲和儲蓄回報是你的假設。", "「缺口」是還差多少；「每月需存」是從現在開始每月要存多少才能補上。"], "財富目標反推": ["想知道要達到某個財富目標，應該多賺、多存，還是追求更高回報的時候。", "先選目標類型；選被動收入目標要同時填收益率；現有資產和每月投入留空會用你的記錄。", "①至④是四條不同的路。下面的組合表一眼看出每月投入和回報率怎樣搭配；顯示「到不了」代表這個組合不可行。"], "投資和項目槓桿": ["考慮借錢投資、按揭買樓或者借錢做生意之前。", "填自有資金、借款和借款利率。三個情境的回報都要填，特別是悲觀情況。", "「保本回報」是資產回報最少要有多少才不虧；「本金虧光的回報」是跌到哪裡自己的錢會全部沒了。先看悲觀那一行，能接受才考慮。"], "保險槓桿": ["比較手上或者考慮中的保單槓桿的時候。", "用計劃書上的數字：每年保費、繳費年數、保額。醫療的保額填每年保障額。", "槓桿越高，每一元保費撬動的保障越多；「每 100 萬保額年保費」用來比較同類產品哪個便宜；重疾會顯示理賠能撐幾年收入。"]};
function how(h){return h?`<div class="howto"><div><b>什麼時候用</b>${h[0]}</div><div><b>怎麼填</b>${h[1]}</div><div><b>怎麼看</b>${h[2]}</div></div>`:''}

{id:'trades',name:'槓桿交易',html:()=>`<section class="sheet">${lead('槓桿交易記錄','期權、融資、期貨、外匯等，每做一筆記一行。賣出期權、融資和期貨的虧損可以超過本金，會用紅色標出。這裡只做記錄和計算，不構成任何交易建議。')}${table('trades')}</section><section class="sheet"><h3>交易統計</h3><div id="sum"></div>${fx(['lev','winrate','expect','mdd'])}</section>`,
 sum:()=>{const t=get('trades').filter(r=>ok(N(r.pnl)));if(!t.length)return '<p class="empty">還沒有填了盈虧的交易。</p>';
  const w=t.filter(r=>N(r.pnl)>0),l=t.filter(r=>N(r.pnl)<0);const wr=w.length/t.length;
  const aw=w.length?w.reduce((s,r)=>s+N(r.pnl),0)/w.length:0,al=l.length?-l.reduce((s,r)=>s+N(r.pnl),0)/l.length:0;
  const ex=wr*aw-(1-wr)*al;const tot=t.reduce((s,r)=>s+N(r.pnl),0),cap=t.reduce((s,r)=>s+(N(r.cap)||0),0);
  let cum=0,pk=0,mdd=0;t.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(r=>{cum+=N(r.pnl);pk=Math.max(pk,cum);mdd=Math.min(mdd,cum-pk)});
  const risky=get('trades').filter(r=>r.over==='是'||r.kind==='賣出期權').length;
  return `<div class="tiles">${kv('交易筆數',t.length)}${kv('勝率',pct(wr,0))}${kv('盈虧比',al>0?num(aw/al,2):'–','','平均賺 ÷ 平均虧')}${kv('每筆期望值',money(ex),ex>=0?'ok':'bad','負數代表長期會虧')}${kv('總盈虧',money(tot),tot>=0?'ok':'bad')}${kv('總投入回報',cap>0?pct(tot/cap):'–')}${kv('累積盈虧最大回撤',money(mdd),mdd<0?'warn':'')}${kv('虧損可超過本金的交易',risky+' 筆',risky?'bad':'ok')}</div>`}},

 sum:()=>{const b=get('biz');if(!b.length)return '<p class="empty">還沒有項目。</p>';const ended=b.filter(r=>r.status&&r.status.indexOf('已結束')===0),wins=ended.filter(r=>r.status==='已結束－成功');

{id:'compare',name:'機會比較',html:()=>`<section class="sheet">${lead('機會橫向比較','把幾個選擇放在一起：產品、存款、投資或項目。回報和跌幅都由你按資料填寫。')}<div class="fields"><label class="f" for="cmpYears">比較年數<input type="number" id="cmpYears" data-s="cmpYears" value="${esc(S.cmpYears)}" inputmode="decimal"></label></div>${table('compare')}</section><section class="sheet"><h3>比較結果</h3><div id="sum"></div>${fx(['fv','oppcost','retdd','realrate'])}</section>`,

{id:'budget',name:'未來預算',html:()=>`<section class="sheet">${lead('生活與養老預算','留空的格子會自動用你的記錄：每月支出用最近 6 個月平均，可投資資產用投資現值。')}${form('budget',[{k:'age',l:'現在幾歲'},{k:'ret',l:'想幾歲退休'},{k:'life',l:'預計壽命'},{k:'exp',l:'每月生活支出',ph:'留空＝用記錄平均'},{k:'assets',l:'可投資資產',ph:'留空＝用投資現值'}])}

 sum:()=>{const b=get('budget'),rc=recent(),inv=investSummary();
  const me=ok(N(b.exp))?N(b.exp):rc.exp,A=ok(N(b.assets))?N(b.assets):inv.total;
  const age=N(b.age),ra=N(b.ret),life=N(b.life),g=N(b.g)/100,r=N(b.r)/100,w=N(b.w)/100;
  const yr=me*12,d=ra-age,n=life-ra;
  const fire=w>0&&ok(yr)?yr/w:NaN,fireRet=ok(fire)&&ok(g)&&ok(d)?fire*Math.pow(1+g,Math.max(0,d)):NaN;
  let pvRet=NaN,pvToday=NaN;
  if(ok(yr)&&ok(g)&&ok(r)&&d>=0&&n>0){const P1=yr*Math.pow(1+g,d);pvRet=Math.abs(r-g)<1e-9?P1*n/(1+r):P1*(1-Math.pow((1+g)/(1+r),n))/(r-g);pvToday=pvRet/Math.pow(1+r,d)}
  return `<div class="tiles">${kv('每月支出（計算用）',money(me),'',ok(N(b.exp))?'你填的':'記錄平均')}${kv('財務自由數字（今天的錢）',money(fire),'','年支出 ÷ 提取比例')}${kv('財務自由數字（退休那年的錢）',money(fireRet))}${kv('完成度',ok(fire)&&fire>0?pct(A/fire,0):'–',ok(fire)?cls(A/fire,1,0.5):'',money(A))}${kv('退休時要有的資金',money(pvRet),'','按通脹逐年增加，領到預計壽命')}${kv('折回今天要準備',money(pvToday))}${kv('退休後要生活',ok(n)?n+' 年':'–','',n>30?'超過 30 年，提取比例宜保守':'')}</div>`},
 sum2:()=>{const b=get('budget');const age=N(b.eAge),st=N(b.eStart),yrs=N(b.eYears),cost=N(b.eCost),have=N(b.eHave),gi=N(b.eInf)/100,er=N(b.eRet)/100;
  let n=st-age,total=NaN,hv=NaN,gap=NaN,mon=NaN;
  if(ok(n)&&ok(yrs)&&ok(cost)&&ok(gi)){n=Math.max(0,n);total=0;for(let k=0;k<yrs;k++)total+=cost*Math.pow(1+gi,n+k);
   if(ok(have)&&ok(er)){hv=have*Math.pow(1+er,n);gap=Math.max(0,total-hv);mon=n>0?pmtCalc(er/12,n*12,0,gap):NaN}}
  return `<div class="tiles">${kv('入學時需要總額',money(total))}${kv('已準備到時的價值',money(hv))}${kv('缺口',money(gap),ok(gap)?(gap>0?'bad':'ok'):'')}${kv('從現在起每月需存',ok(n)&&n<=0?'已到入學年齡':money(mon))}</div>`}},

  ${kv('③ 收入要增加',ok(reqP)&&ok(g.pmt)?money(Math.max(0,reqP-g.pmt))+'／月':'–','','假設支出不變，多賺的全部存下')}
  ${kv('④ 年期與投入不變，需要年回報',ok(reqR)?pct(reqR):(g.years>0?'超過 200%，不現實':'–'),ok(reqR)?cls(-reqR,-0.06,-0.12):'bad','再去「機會比較」看哪些選擇做得到')}</div>`},
 sum2:()=>{const g=goalInputs();if(!ok(g.target)||!ok(g.pv))return '<p class="hint">填好目標和現有資產後，這裡會顯示組合表。</p>';

 sum:()=>{const o=get('levsim');const E=N(o.E),D=N(o.D)||0,i=(N(o.i)||0)/100;if(!(E>0))return '<p class="hint">先填自有資金。</p>';

  return `<div class="tiles">${kv('槓桿倍數',num(lv,2)+' 倍')}${kv('總投入',money(T))}${kv('保本回報',pct(D*i/T,2),'','低於這個就開始虧')}${kv('本金虧光的回報',pct((D*i-E)/T,1),'bad','跌到這裡自有資金歸零')}</div>
  <div class="tbl-wrap"><table class="tbl read"><thead><tr><th>情境</th><th>資產年回報</th><th>不借錢時自有回報</th><th>借錢後自有回報</th><th>借錢後賺或虧</th></tr></thead><tbody>${sc.map(([n,r])=>{if(!ok(r))return `<tr><td>${n}</td><td colspan="4" class="muted">未填</td></tr>`;const x=r/100,er=(T*x-D*i)/E;return `<tr><td>${n}</td><td>${pct(x)}</td><td>${pct(x)}</td><td><b>${pct(er)}</b>${er<=-1?' <span class="tag bad">本金虧光</span>':''}</td><td>${money(T*x-D*i)}</td></tr>`}).join('')}</tbody></table></div>`},
 sum2:()=>{const rows=[];const o=get('levsim');const E=N(o.E),D=N(o.D)||0,i=(N(o.i)||0)/100;

function chart(){
  const m=monthAgg();const ks=Object.keys(m).sort().slice(-12);if(!ks.length)return '';
  const W=640,H=220,L=56,B=28,T=10,max=Math.max(1,...ks.map(k=>Math.max(m[k].inc,m[k].exp)));
  const step=(W-L-10)/ks.length,bw=Math.min(18,step/3);const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,0.5,1].map(t=>max*t);
  return `<div class="chart"><div class="legend"><span><i style="background:var(--accent)"></i>收入</span><span><i style="background:var(--gold)"></i>支出</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近十二個月收入與支出">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(t).toLocaleString('zh-Hant')}</text>`).join('')}
  ${ks.map((k,i)=>{const x=L+i*step+step/2;return `<rect x="${x-bw-1}" y="${y(m[k].inc)}" width="${bw}" height="${H-B-y(m[k].inc)}" fill="var(--accent)" rx="2"/><rect x="${x+1}" y="${y(m[k].exp)}" width="${bw}" height="${H-B-y(m[k].exp)}" fill="var(--gold)" rx="2"/><text x="${x}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${k.slice(2)}</text>`}).join('')}</svg></div>`;
}

const LEGQ=['已經立好遺囑','重要資產有指定受益人','股權有繼承或轉讓安排','跨境資產（香港／內地）手續已了解','資產不需凍結也能馬上動用一部分','家人知道你的安排'];

function ck(){return get('check')}
function cv(k){const v=N(ck().vals[k]);return v}
function checkHtml(){
 const c=ck();
 const st=`<div class="sub" role="tablist">${[['s1','第一階段・第二次面談'],['s2','第二階段・第三次面談'],['s3','第三階段・年度複檢']].map(([k,n])=>`<button type="button" data-stage="${k}" aria-current="${stage===k}">${n}</button>`).join('')}</div>`;
 const ci=(k,l)=>`<label class="f" for="ck-${k}">${l}<input type="number" id="ck-${k}" data-ck2="${k}" value="${esc(c.vals[k]==null?'':c.vals[k])}" inputmode="decimal" step="any"></label>`;
 if(stage==='s1')return `<section class="sheet">${lead('客戶體檢','給客戶面談用。第二次面談只喚醒意識，不做計算。')}${st}</section>
 <section class="sheet"><h3>家庭的財富水系統</h3><div class="svgbox">${waterSvg()}</div></section>
 <section class="sheet"><h3>六個問題</h3><p class="muted">請客戶自己按。不確定，也是一種答案。</p><div class="cards">${MODS.map(m=>`<div class="card"><span class="ctag${m.tag==='防護牆'?' wall':''}">${m.tag}・${m.name}</span><p>${m.q}</p><div class="choices">${CH.map(o=>`<button type="button" data-ans="${m.id}" data-v="${o[0]}" aria-pressed="${c.answers[m.id]===o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')}</div></section>
 <section class="sheet"><div class="mhead"><h3>健康圖</h3><span class="muted">點選最想先弄清楚的 1–2 項</span></div><div class="grid6">${MODS.map(m=>{const a=c.answers[m.id],p=c.selected.indexOf(m.id)>-1;return `<button type="button" class="tile${a?' '+a:''}" data-pick="${m.id}" aria-pressed="${p}"><b>${m.name}</b><span>${a?LB[a]:'未回答'}</span>${p?'<span class="pick">已選，下次詳細計算</span>':''}</button>`}).join('')}</div><button type="button" class="btn" data-stage="s2">帶著選擇進入第三次面談</button></section>`;
 if(stage==='s2'){const show=id=>c.selected.indexOf(id)>-1||c['show_'+id];
  return `<section class="sheet">${lead('客戶體檢','第三次面談：只計算客戶選的項目。')}${st}</section>
 <section class="sheet"><h3>財務地基</h3>${'<div class="fields">'+ci('inc','每月收入')+ci('exp','每月支出')+ci('cash','現金存款')+ci('inv','投資資產（不含自住房）')+ci('prop','房產及其他資產')+ci('debt','負債總額')+'</div>'}<div id="ck-base"></div></section>
 <section class="sheet"><h3>要計算的項目</h3><div class="row">${MODS.map(m=>`<button type="button" class="chip" data-show="${m.id}" aria-pressed="${!!show(m.id)}">${m.name}</button>`).join('')}</div></section>
 ${show('edu')?`<section class="sheet"><div class="mhead"><h3>教育金：還差多少？</h3><span class="light" id="l-edu"></span></div><div class="fields">${ci('e_age','孩子現在幾歲')+ci('e_start','幾歲入讀大學')+ci('e_years','讀幾年')+ci('e_cost','今年每年學費＋生活費')+ci('e_have','已準備的教育金')}</div><div class="assume"><span class="lbl">假設（由你填寫）</span><div class="fields">${ci('e_inf','學費每年上漲 %')+ci('e_ret','儲蓄每年回報 %')}</div></div><div id="ck-edu"></div></section>`:''}
 ${show('life')?`<section class="sheet"><div class="mhead"><h3>生活基金：離財務自由還有多遠？</h3><span class="light" id="l-life"></span></div><div class="fields">${ci('r_age','現在幾歲')+ci('r_ret','想幾歲退休')+ci('r_life','預計壽命')}</div><div class="assume"><span class="lbl">假設（由你填寫）</span><div class="fields">${ci('r_inf','生活通脹每年 %')+ci('r_wr','每年可提取比例 %')+ci('r_grow','退休前投資回報 %')}</div></div><div id="ck-life"></div></section>`:''}
 ${show('med')?`<section class="sheet"><div class="mhead"><h3>醫療：一場大病，誰來付？</h3><span class="light" id="l-med"></span></div><div class="row"><span class="muted">有沒有終身醫療保障</span><div class="seg">${[['y','有'],['n','沒有']].map(([v,t])=>`<button type="button" data-medhas="${v}" aria-pressed="${c.medHas===v}">${t}</button>`).join('')}</div></div><div class="fields">${ci('md_have','現有每年保障額')+ci('md_want','希望的每年保障額')}</div><div id="ck-med"></div></section>`:''}
 ${show('ci')?`<section class="sheet"><div class="mhead"><h3>重疾：收入停了，能撐幾年？</h3><span class="light" id="l-ci"></span></div><div class="fields">${ci('c_have','現有重疾保額')}</div><div class="assume"><span class="lbl">假設（由你填寫）</span><div class="fields">${ci('c_years','希望補償幾年收入')}</div></div><div id="ck-ci"></div></section>`:''}
 ${show('ins')?`<section class="sheet"><div class="mhead"><h3>人壽：少了你的收入，家裡怎麼辦？</h3><span class="light" id="l-ins"></span></div><div class="fields">${ci('i_have','現有壽險保額')}</div><div class="assume"><span class="lbl">假設（由你填寫）</span><div class="fields">${ci('i_years','需要照顧家庭幾年')}</div></div><div id="ck-ins"></div></section>`:''}
 ${show('leg')?`<section class="sheet"><div class="mhead"><h3>傳承：資產能順利交到下一代手上嗎？</h3><span class="light" id="l-leg"></span></div><p class="muted">不做計算，逐項確認。</p><div>${LEGQ.map((t,i)=>`<div class="checkrow"><span>${t}</span><div class="yn">${[['y','是'],['n','否']].map(([v,l])=>`<button type="button" data-leg="${i}" data-v="${v}" aria-pressed="${(c.leg[i]===true&&v==='y')||(c.leg[i]===false&&v==='n')}">${l}</button>`).join('')}</div></div>`).join('')}</div></section>`:''}`;}
 const recs=get('checkRecords');
 return `<section class="sheet">${lead('客戶體檢','年度複檢：保存這次的健康圖，明年拿來對比。')}${st}</section>
 <section class="sheet"><h3>保存這次的健康圖</h3><p class="muted">建議用客戶代號，不要填全名或證件資料。</p><div class="fields"><label class="f" for="ck-code">客戶代號<input type="text" id="ck-code" placeholder="例如：陳先生A"></label></div><button type="button" class="btn" id="ck-save">保存本次結果</button><p class="muted" id="ck-msg" aria-live="polite"></p></section>
 <section class="sheet"><h3>和去年對比</h3>${recs.length?recs.map((r,i)=>`<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px"><span><b>${esc(r.code)}</b> <span class="muted">${r.date}</span></span><button type="button" class="btn small ghost" data-cmp="${i}">和現在對比</button></div>`).join(''):'<p class="hint">還沒有保存的記錄。</p>'}<div id="ck-cmp" class="tiles"></div></section>`;
}
function waterSvg(){return `<svg viewBox="0 0 360 230" role="img" aria-label="財富水系統示意圖"><g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11" fill="var(--ink)">
<rect x="18" y="18" width="70" height="12" rx="3" fill="var(--accent)"/><rect x="74" y="18" width="12" height="28" rx="3" fill="var(--accent)"/><text x="18" y="12" font-weight="700">收入・水龍頭</text>
<line x1="80" y1="48" x2="80" y2="104" stroke="var(--accent)" stroke-width="5" stroke-dasharray="6 5"/>
<rect x="36" y="74" width="196" height="122" rx="10" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="10 6"/><text x="106" y="68" fill="var(--gold)" font-weight="700">保險・防護牆（醫療・重疾・人壽）</text>
<rect x="50" y="86" width="168" height="98" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><rect x="52" y="118" width="164" height="64" rx="4" fill="var(--accent-soft)"/>
<text x="98" y="155" font-weight="700" font-size="13">資產・水池</text><text x="78" y="172" fill="var(--muted)">教育金・生活基金</text>
<line x1="96" y1="184" x2="96" y2="214" stroke="var(--bad)" stroke-width="3" stroke-dasharray="3 4"/><circle cx="96" cy="220" r="4" fill="var(--bad)"/><text x="106" y="222" fill="var(--bad)" font-weight="700">負債・漏洞</text>
<rect x="218" y="160" width="34" height="8" fill="var(--ink)"/><line x1="252" y1="168" x2="252" y2="196" stroke="var(--accent)" stroke-width="4" stroke-dasharray="4 4"/><text x="260" y="190" font-weight="700">支出・出水口</text>
<polyline points="218,104 286,104 286,128" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linejoin="round"/><rect x="262" y="128" width="62" height="34" rx="5" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2"/>
<text x="254" y="96" font-weight="700">傳承・傳水管</text><text x="275" y="150">下一代</text></g></svg>`}
function setL(id,s){const el=$(id);if(!el)return;el.className='light'+(s?' '+s:'');el.textContent=s?LB[s]:'待填寫'}
function rl(h,n){if(!ok(h)||!ok(n)||n<=0)return '';const r=h/n;return r>=1?'ok':(r>=0.5?'unsure':'no')}
function checkAfter(){
 if(stage!=='s2')return;const c=ck();
 const inc=cv('inc'),exp=cv('exp'),cash=cv('cash'),debt=cv('debt');
 const b=$('ck-base');if(b)b.innerHTML=`<div class="tiles">${kv('每月結餘',money(inc-exp))}${kv('淨資產',money((cash||0)+(cv('inv')||0)+(cv('prop')||0)-(debt||0)))}${kv('應急金夠幾個月',ok(cash/exp)?num(cash/exp,1)+' 個月':'–',cls(cash/exp,12,6),'目標 12 個月')}</div>`;
 if($('ck-edu')){const age=cv('e_age'),st=cv('e_start'),y=cv('e_years'),co=cv('e_cost'),hv=cv('e_have'),gi=cv('e_inf')/100,er=cv('e_ret')/100;let n=st-age,t=NaN,h=NaN,g=NaN,mo=NaN;
  if(ok(n)&&ok(y)&&ok(co)&&ok(gi)){n=Math.max(0,n);t=0;for(let k=0;k<y;k++)t+=co*Math.pow(1+gi,n+k);if(ok(hv)&&ok(er)){h=hv*Math.pow(1+er,n);g=Math.max(0,t-h);mo=n>0?pmtCalc(er/12,n*12,0,g):NaN}}
  $('ck-edu').innerHTML=`<div class="tiles">${kv('讀大學時需要總額',money(t))}${kv('已準備到時的價值',money(h))}${kv('缺口',money(g))}${kv('從現在起每月需存',money(mo))}</div>`;setL('l-edu',rl(h,t))}
 if($('ck-life')){const a=cv('r_age'),r=cv('r_ret'),l=cv('r_life'),g=cv('r_inf')/100,w=cv('r_wr')/100,inv=cv('inv');const ft=w>0&&ok(exp)?exp*12/w:NaN,ff=ok(ft)&&ok(g)&&ok(r-a)?ft*Math.pow(1+g,Math.max(0,r-a)):NaN,p=inv/ft;
  const gr=cv('r_grow')/100,yrs=r-a,pv0=ok(inv)?inv:0,sur=inc-exp;
  const need=ok(ff)&&ok(gr)&&yrs>0?pmtCalc(gr/12,yrs*12,pv0,ff):NaN;
  const fvSur=ok(gr)&&yrs>0&&ok(sur)?fvCalc(gr/12,yrs*12,Math.max(0,sur),pv0):NaN;
  $('ck-life').innerHTML=`<div class="tiles">${kv('自由數字（今天的錢）',money(ft))}${kv('自由數字（退休那年的錢）',money(ff))}${kv('目前完成',ok(p)?pct(p,0):'–')}${kv('退休後要生活',ok(l-r)?(l-r)+' 年':'–')}${kv('每月要存多少',ok(need)?money(Math.max(0,need)):'–',ok(need)&&ok(sur)?(sur>=need?'ok':'bad'):'',ok(need)?'從現在到 '+r+' 歲，回報 '+pct(gr,1):'填退休前投資回報')}${kv('每月結餘全部存起來，退休時會有',money(fvSur),ok(fvSur)&&ok(ff)?(fvSur>=ff?'ok':'warn'):'',ok(fvSur)&&ok(ff)?(fvSur>=ff?'足夠達到自由數字':'還差 '+money(ff-fvSur)):'')}</div>`;setL('l-life',ok(p)?(p>=1?'ok':(p>=0.5?'unsure':'no')):'')}
 if($('ck-med')){const h=cv('md_have'),w=cv('md_want');$('ck-med').innerHTML=`<div class="tiles">${kv('保障缺口',ok(w)?money(Math.max(0,w-(h||0))):'–')}</div>`;setL('l-med',c.medHas==='n'?'no':(c.medHas==='y'?rl(h,w):''))}
 if($('ck-ci')){const h=cv('c_have'),y=cv('c_years'),ai=inc*12,need=ai*y;$('ck-ci').innerHTML=`<div class="tiles">${kv('現在能撐',ok(h)&&ai>0?num(h/ai,1)+' 年':'–')}${kv('需要保額',money(need))}${kv('缺口',ok(need)?money(Math.max(0,need-(h||0))):'–')}</div>`;setL('l-ci',rl(h,need))}
 if($('ck-ins')){const h=cv('i_have'),y=cv('i_years'),need=(debt||0)+exp*12*y;$('ck-ins').innerHTML=`<div class="tiles">${kv('需要（負債＋家庭開支）',money(need))}${kv('缺口',ok(need)?money(Math.max(0,need-(h||0))):'–')}</div>`;setL('l-ins',rl(h,need))}
 if($('l-leg')){const d=c.leg.filter(x=>x!==null).length,y=c.leg.filter(x=>x===true).length;setL('l-leg',d<6?'':(y===6?'ok':(y>=3?'unsure':'no')))}
}

/* ================= 渲染與事件 ================= */
let tab='home';try{tab=localStorage.getItem('wealthsys_tab')||'home'}catch(e){}
if(!TABS.some(t=>t.id===tab))tab='home';
function nav(){$('nav').innerHTML=TABS.map(t=>(t.id==='lib'?'<span class="sep"></span>':'')+`<button type="button" data-tab="${t.id}" aria-current="${t.id===tab}">${t.name}</button>`).join('')}
function sums(){const t=TABS.find(x=>x.id===tab);const s=$('sum');if(s&&t.sum)s.innerHTML=t.sum();const s2=$('sum2');if(s2&&t.sum2)s2.innerHTML=t.sum2();if(t.after)t.after()}
function render(){nav();$('cur').value=cur();const t=TABS.find(x=>x.id===tab);$('main').innerHTML=DL+t.html()+(PAGES[tab]&&!(tab==='check'&&stage==='s3')?repBar(tab):'');sums()}
function update(){recalcCells();sums()}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){tab=d.tab;try{localStorage.setItem('wealthsys_tab',tab)}catch(x){}render();window.scrollTo(0,0);return}
 if(d.add){get(d.add).unshift(SCHEMA[d.add].add());persist(d.add);render();const f=document.querySelector(`[data-t="${d.add}"][data-i="0"]`);if(f)f.focus();return}
 if(d.del!==undefined&&d.del){get(d.del).splice(+d.i,1);persist(d.del);render();return}
 if(d.stage){stage=d.stage;render();return}
 if(d.ans){ck().answers[d.ans]=d.v;persist('check');render();return}
 if(d.pick){const s=ck().selected,i=s.indexOf(d.pick);if(i>-1)s.splice(i,1);else{if(s.length>=2)s.shift();s.push(d.pick)}persist('check');render();return}
 if(d.show){const c=ck(),on=c.selected.indexOf(d.show)>-1||c['show_'+d.show];if(on){c['show_'+d.show]=false;const i=c.selected.indexOf(d.show);if(i>-1)c.selected.splice(i,1)}else c['show_'+d.show]=true;persist('check');render();return}
 if(d.medhas){ck().medHas=d.medhas;persist('check');render();return}
 if(d.leg!==undefined){ck().leg[+d.leg]=d.v==='y';persist('check');render();return}
 if(b.id==='ck-save'){const code=$('ck-code').value.trim();const m=$('ck-msg');if(!code){m.textContent='請先填寫客戶代號。';return}if(!Object.keys(ck().answers).length){m.textContent='第一階段還沒有答案。';return}
   const dt=new Date();get('checkRecords').unshift({code,date:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),answers:Object.assign({},ck().answers)});persist('checkRecords');render();$('ck-msg').textContent='已保存：'+code;return}
 if(d.cmp!==undefined){const r=get('checkRecords')[+d.cmp];const R={no:0,unsure:1,ok:2};$('ck-cmp').innerHTML=MODS.map(m=>{const a=r.answers[m.id],b2=ck().answers[m.id];let c='',t='沒變化';if(a&&b2&&R[b2]>R[a]){c='ok';t='進步了'}else if(a&&b2&&R[b2]<R[a]){c='bad';t='變差了'}else if(!a||!b2)t='資料不全';return kv(m.name+'：'+(a?LB[a]:'–')+' → '+(b2?LB[b2]:'–'),t,c)}).join('');return}
 if(b.id==='friend-btn'){enterFriend();return}
 if(b.id==='friend-exit'){exitFriend();return}
 if(d.repmake){makeImage(d.repmake);return}
 if(b.id==='rep-share'){shareImage();return}
 if(b.id==='bk-copy'){const txt=JSON.stringify(S);const msg=$('bk-msg');const fall=()=>{$('bk-text').value=txt;$('bk-text').select();msg.textContent='已放進下面的方框並選取，請手動複製。'};
   try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent='已複製，可以貼到 Notion 或備忘錄。'},fall)}catch(x){fall()}return}
 if(b.id==='bk-restore'){const msg=$('bk-msg');try{const o=JSON.parse($('bk-text').value);let n=0;KEYS.forEach(k=>{if(o[k]!==undefined){S[k]=o[k];persist(k);n++}});msg.textContent=n?'已還原。':'內容裡沒有可還原的資料。';if(n)render()}catch(x){msg.textContent='內容格式不對，請貼上完整的備份。'}return}
});
function onField(e){
 const el=e.target;const d=el.dataset;
 if(d.t){const r=get(d.t)[+d.i];if(!r)return;r[d.k]=el.value;persist(d.t);update();return}
 if(d.o){get(d.o)[d.k]=el.value;persist(d.o);if(el.tagName==='SELECT')render();else update();return}
 if(d.s){S[d.s]=el.value;persist(d.s);update();return}
 if(d.ck2){ck().vals[d.ck2]=el.value;persist('check');checkAfter();return}
}
document.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onField(e)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.repsel){const r=get('report');r.sel=r.sel||[];const id=e.target.dataset.repsel,i=r.sel.indexOf(id);if(e.target.checked&&i<0)r.sel.push(id);if(!e.target.checked&&i>-1)r.sel.splice(i,1);persist('report');const c=$('rep-card');if(c)c.innerHTML=reportHtml();return}if(e.target.id==='cur'){get('settings').cur=e.target.value;persist('settings');render();return}if(e.target.tagName==='SELECT')onField(e)});

render();
initCloud();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
